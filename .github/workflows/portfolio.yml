name: Portfolio

# Quality gates for VERSION_4 (the Next.js portfolio). Runs only when that folder, or this file,
# changes. Nothing here deploys: hosting builds the site itself from the same commands.
#
# Actions are pinned to major version tags, which are mutable. .github/dependabot.yml keeps them,
# and the npm dependencies, up to date through reviewed pull requests.
on:
  push:
    paths:
      - "VERSION_4/**"
      - ".github/workflows/portfolio.yml"
  pull_request:
    paths:
      - "VERSION_4/**"
      - ".github/workflows/portfolio.yml"
  workflow_dispatch:

# Least privilege: jobs can read the repository and nothing else. Artifacts and caches do not need
# a token scope.
permissions:
  contents: read

# A newer push to the same branch or PR replaces the run that is still going.
concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: VERSION_4

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, types, format, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: VERSION_4/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: VERSION_4/pnpm-lock.yaml

      # --frozen-lockfile: the lockfile is the record of what was reviewed. A change to it must be
      # committed, never made silently by CI.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Types of the app, then of the Playwright specs (tests/e2e/tsconfig.json).
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test

      # Production dependencies must have no known high or critical advisory. This is the blocking
      # check: the lockfile is frozen, so a failure means a reviewed update is due.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      # Development tooling never ships to visitors. Advisories there are reported, not blocking.
      - name: Audit development dependencies (report only)
        continue-on-error: true
        run: pnpm audit --dev --audit-level=high

  build:
    name: Build and verify headers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: VERSION_4/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: VERSION_4/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # next build, then scripts/postbuild.mjs (hashes inline scripts, writes out/_headers,
      # out/headers.vercel.json and out/.well-known/security.txt, and fails on any problem).
      - run: pnpm build

      - name: Verify the generated headers
        run: |
          test -f out/_headers
          test -f out/.well-known/security.txt
          test -f out/headers.vercel.json
          # No unsafe-inline or unsafe-eval anywhere in the policy: scripts, styles and style
          # attributes are all allowed by hash.
          if grep -E "'unsafe-(inline|eval)'" out/_headers; then
            echo "::error::the policy allows unsafe-inline or unsafe-eval"
            exit 1
          fi
          # Every html file (404.html and _not-found included) has its policy as the first <meta>
          # in <head>, every page has a header policy holding the hash of each inline script, style
          # and style attribute, every baseline header is present, security.txt has not expired,
          # and a committed vercel.json is not stale.
          node scripts/postbuild.mjs --check

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: VERSION_4/out
          # out/.well-known is a dot folder and is skipped by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: End-to-end (Playwright)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: VERSION_4/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: VERSION_4/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The tests run against the exact export the build job produced.
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: VERSION_4/out

      - run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts starts tests/e2e/static-server.mjs, which serves out/ with out/_headers.
      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            VERSION_4/playwright-report
            VERSION_4/test-results
          if-no-files-found: ignore
          retention-days: 7
